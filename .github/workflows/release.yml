name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, including the v prefix
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release version must be a semantic version such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          package_version="$(jq -r '.version' web/package.json)"
          if [[ "${RELEASE_VERSION#v}" != "$package_version" ]]; then
            echo "Release version $RELEASE_VERSION does not match web/package.json version $package_version" >&2
            exit 1
          fi

          if [[ "$RELEASE_VERSION" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "A prerelease semantic version must set the prerelease input" >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != *-* && "$PRERELEASE" == "true" ]]; then
            echo "A stable semantic version cannot be published as a prerelease" >&2
            exit 1
          fi

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          default_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq '.sha')"
          if [[ "$GITHUB_REF_NAME" != "$default_branch" || "$GITHUB_SHA" != "$default_sha" ]]; then
            echo "Releases must run from the current tip of the default branch ($default_branch at $default_sha)" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists" >&2
            exit 1
          fi

          check_runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          required_checks=(
            "Go"
            "Web"
            "Structure"
            "CodeQL (go)"
            "CodeQL (javascript-typescript)"
            "CodeQL (actions)"
          )
          for required_check in "${required_checks[@]}"; do
            conclusion="$(jq -r --arg name "$required_check" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$check_runs")"
            if [[ "$conclusion" != "success" ]]; then
              echo "Required check $required_check is $conclusion for $GITHUB_SHA" >&2
              exit 1
            fi
          done

          echo "Validated $RELEASE_VERSION from $default_branch at $GITHUB_SHA"

  web:
    name: Build web assets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build web application
        run: pnpm --dir web build
      - name: Upload embedded web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Download embedded web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          test -s web/dist/index.html

          version_number="${RELEASE_VERSION#v}"
          archive_root="switch-a_${version_number}_${TARGET_GOOS}_${TARGET_GOARCH}"
          stage_dir="$RUNNER_TEMP/$archive_root"
          release_dir="$GITHUB_WORKSPACE/release"
          binary_name="switch-a"
          if [[ "$TARGET_GOOS" == "windows" ]]; then
            binary_name="switch-a.exe"
          fi

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          built_at="$(date -u -d "@$source_date_epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p "$stage_dir" "$release_dir"

          ldflags="-s -w -X github.com/doraemonkeys/switch-a/internal/buildinfo.Version=$RELEASE_VERSION -X github.com/doraemonkeys/switch-a/internal/buildinfo.Commit=$GITHUB_SHA -X github.com/doraemonkeys/switch-a/internal/buildinfo.BuiltAt=$built_at"
          CGO_ENABLED=0 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" \
            go build -trimpath -buildvcs=true -ldflags "$ldflags" -o "$stage_dir/$binary_name" ./cmd/switch-a

          cp LICENSE README.md README-ZH.md config.example.yaml "$stage_dir/"
          find "$stage_dir" -exec touch -d "@$source_date_epoch" {} +

          if [[ "$TARGET_GOOS" == "windows" ]]; then
            (cd "$RUNNER_TEMP" && zip -X -q -r "$release_dir/$archive_root.zip" "$archive_root")
          else
            tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
              -C "$RUNNER_TEMP" -czf "$release_dir/$archive_root.tar.gz" "$archive_root"
          fi

          if [[ "$TARGET_GOOS" == "linux" && "$TARGET_GOARCH" == "amd64" ]]; then
            expected="switch-a $RELEASE_VERSION (commit $GITHUB_SHA, built $built_at)"
            actual="$("$stage_dir/$binary_name" --version)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Version output $actual does not match $expected" >&2
              exit 1
            fi
          fi
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets
          archives=(*.tar.gz *.zip)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "Expected 6 release archives, found ${#archives[@]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" | LC_ALL=C sort -k2 > checksums.txt
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/checksums.txt
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-assets/*.tar.gz release-assets/*.zip release-assets/checksums.txt)
          release_args=(
            "$RELEASE_VERSION"
            "${assets[@]}"
            --target "$GITHUB_SHA"
            --title "switch-a $RELEASE_VERSION"
            --generate-notes
            --fail-on-no-commits
            --notes "Prebuilt archives include the embedded admin UI. Verify an archive with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\` and compare it with \`checksums.txt\`."
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
