name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Install quality tools
        env:
          # gopls releases may advance their toolchain requirement independently of the project.
          GOTOOLCHAIN: auto
        run: make install-go-tools
      - name: Run Go quality gates
        run: make ci-go

  fixture-check-windows:
    name: Fixture checkout (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate fixture checkout
        shell: pwsh
        run: |
          $fixtureRoot = "internal/codex/headers/testdata"
          $fixtureFiles = @(git ls-files "$fixtureRoot/**")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enumerate tracked fixtures"
          }
          if ($fixtureFiles.Count -eq 0) {
            throw "No tracked fixture files found"
          }
          foreach ($fixture in $fixtureFiles) {
            $attribute = git check-attr eol -- $fixture
            if ($LASTEXITCODE -ne 0 -or $attribute -notmatch ': eol: lf$') {
              throw "$fixture does not resolve to eol=lf: $attribute"
            }
            $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $fixture))
            if ([Array]::IndexOf($bytes, [byte]13) -ge 0) {
              throw "$fixture contains a carriage-return byte"
            }
          }

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Run web quality gates
        run: make ci-web
      - name: Build web application
        run: pnpm --dir web build

  structure:
    name: Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce module boundaries
        uses: doraemonkeys/sloc-guard/.github/action@master
        with:
          config-path: .sloc-guard.toml
          paths: "."
          version: latest
