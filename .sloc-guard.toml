# More config: https://github.com/doraemonkeys/sloc-guard
version = "2"

[scanner]
gitignore = true
exclude = ["**/.git/**", "**/build/**", "**/dist/**", "**/node_modules/**"]

[content]
extensions = ["go", "js", "ts"]
max_lines = 600
warn_threshold = 0.9
skip_comments = true
skip_blank = true

# Per-subdirectory rules (monorepo)

# web (Node.js/TypeScript)
[[content.rules]]
pattern = "web/**"
max_lines = 600

# Test files - relaxed limits
[[content.rules]]
pattern = "web/**/*.test.*"
max_lines = 1200
warn_at = 1000

# Go test files
[[content.rules]]
pattern = "**/*_test.go"
max_lines = 1100
warn_at = 900

[structure]
max_files = 20
max_dirs = 20
