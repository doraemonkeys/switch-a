# More config: https://github.com/doraemonkeys/sloc-guard
version = "2"

[scanner]
gitignore = true
exclude = ["**/.git/**", "**/build/**", "**/dist/**", "**/node_modules/**"]

[content]
extensions = ["go", "js", "ts"]
max_lines = 600
warn_threshold = 0.9
skip_comments = true
skip_blank = true

# Per-subdirectory rules (monorepo)

# web (Node.js/TypeScript)
[[content.rules]]
pattern = "web/**"
max_lines = 600

# Test files - relaxed limits
[[content.rules]]
pattern = "web/**/*.test.*"
max_lines = 1200
warn_at = 1000

[[content.rules]]
pattern = "web/**/*.tsx"
max_lines = 800
warn_at = 700

# Go test files
[[content.rules]]
pattern = "**/*_test.go"
max_lines = 1100
warn_at = 900

[structure]
max_files = 50
max_dirs = 20
count_exclude = ["*_test.go", "*.test.*", "tmpclaude-*"]

# Window resolution, exact-instant validation, token analytics, downstream client
# access, and response facts are shared by independent delivery/storage layers.
# Client access is separate from Codex identity, upstream credentials, and admin
# authentication. Response facts keep protocol completion and write outcomes
# independent of HTTP analysis and WebSocket lifecycle policy. This rule changes
# only the direct-domain count, preserving every file and nested-folder limit.
[[structure.rules]]
scope = "./internal"
max_dirs = 27
reason = "analyticswindow, instant, tokenanalytics, clientaccess, and responsefacts are independent shared domains"
