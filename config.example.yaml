# Switch-A 配置文件示例
# 将此文件复制为 config.yaml 并修改配置值
#
# 配置优先级（从高到低）：
#   1. 环境变量 (SWITCHA_*)
#   2. 配置文件 (config.yaml)
#   3. 默认值
#
# 配置文件搜索路径：
#   - ./config.yaml (当前目录)
#   - ./config/config.yaml
#   - /etc/switch-a/config.yaml

# 代理服务端口
# 环境变量: SWITCHA_PORT
# 默认值: 28080
port: "28080"

# 管理服务端口
# 环境变量: SWITCHA_ADMIN_PORT
# 默认值: 28081
admin_port: "28081"

# SQLite 数据库路径
# 环境变量: SWITCHA_DB_PATH
# 默认值: ./data.db
db_path: "./data.db"

# 管理 API 认证令牌 (必填)
# 环境变量: SWITCHA_ADMIN_TOKEN
# 无默认值，必须设置
admin_token: "your-secret-token-here"

# 日志文件路径
# 环境变量: SWITCHA_LOG_PATH
# 默认值: ./logs/switch-a.log
log_path: "./logs/switch-a.log"

# 单个日志文件最大大小 (MB)
# 环境变量: SWITCHA_LOG_MAX_SIZE_MB
# 默认值: 100
log_max_size_mb: 100

# 日志文件保留天数
# 环境变量: SWITCHA_LOG_MAX_KEEP_DAYS
# 默认值: 7
log_max_keep_days: 7

# 日志级别
# 环境变量: SWITCHA_LOG_LEVEL
# 可选值: debug, info, warn, error
# 默认值: info
log_level: "info"

# Codex 持久状态 keyring 文件路径（相关功能关闭时可省略；文件内密钥不得写入本配置）
# 环境变量: SWITCHA_CODEX_KEYRING_FILE
# codex_keyring_file: "/run/secrets/switch-a-codex-keyring.json"

# Debug 捕获的进程级安全上限（功能默认关闭）
# 环境变量名称为 SWITCHA_ 加对应键名的大写形式
# 内存上限不能低于默认 session quota 256 MiB
debug_capture_memory_ceiling_mib: 512
debug_capture_max_active_records: 1024
debug_capture_max_active_traces: 1024
debug_capture_max_transitions_per_trace: 64
debug_capture_max_pending_exports: 8
debug_capture_max_concurrent_downloads: 2
debug_capture_detail_preview_bytes: 65536
debug_capture_detail_event_limit: 200
debug_capture_download_token_ttl_seconds: 300
debug_capture_max_records_per_provider: 100
# 分块必须在 4096 至 1048576 bytes 之间，避免元数据放大或过量预留
debug_capture_chunk_bytes: 32768
debug_capture_export_line_bytes: 65536
